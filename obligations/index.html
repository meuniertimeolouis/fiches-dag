<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Droit des obligations</title>
<link rel="stylesheet" href="../assets/polices.css">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
:root{
  --bg:#F6F4F1;--surface:#FFFFFF;--ink:#1E1A16;--muted:#655C54;--line:#E3DDD6;
  --accent:#8A4B1F;--accent-soft:#F7ECE3;--ok:#2F6B4F;--ok-bg:#E4F2EA;--ko:#9A2F2F;--ko-bg:#F8E6E6;
  --warn:#8A5A00;--warn-bg:#FFF4DB;
  --f-display:"Spectral","Iowan Old Style",Georgia,serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12100E;--surface:#1C1916;--ink:#ECE7E1;--muted:#A59C92;--line:#332D27;
  --accent:#E3A77A;--accent-soft:#2E2118;--ok:#7FC6A3;--ok-bg:#16281F;--ko:#E69494;--ko-bg:#2E1818;
  --warn:#F0BA5C;--warn-bg:#2A2214;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12100E;--surface:#1C1916;--ink:#ECE7E1;--muted:#A59C92;--line:#332D27;
  --accent:#E3A77A;--accent-soft:#2E2118;--ok:#7FC6A3;--ok-bg:#16281F;--ko:#E69494;--ko-bg:#2E1818;
  --warn:#F0BA5C;--warn-bg:#2A2214;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 64px}
.home-link{display:inline-flex;gap:6px;font:500 13px var(--f-body);color:var(--accent);text-decoration:none;margin-bottom:10px}
.home-link:hover{text-decoration:underline}
header.top{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:6px}
.eyebrow,.lab{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.1;margin:4px 0 0}
.top p{margin:6px 0 0;color:var(--muted);max-width:66ch}
h2{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.2;margin:0}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:14px 0 22px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;color:var(--muted);font:600 14.5px var(--f-body);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button{font-family:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;font:500 14px var(--f-body);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.btn.ko{border-color:var(--ko);color:var(--ko);background:var(--ko-bg)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type="search"]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:14px var(--f-body)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;font:500 12.5px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.seg{display:inline-grid;grid-auto-flow:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);font:500 13px var(--f-body);padding:8px 14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 22px;color:var(--muted);text-align:center;background:var(--surface)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:19px;margin-bottom:4px}
.muted{color:var(--muted)}
.art{font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 8px;cursor:pointer}

/* Régimes */
.split{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
.side{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow-y:auto}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.rlist .ch{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.rlist button{width:100%;text-align:left;border:0;border-left:2px solid var(--line);background:none;color:var(--ink);padding:6px 10px;font:500 14px var(--f-body);cursor:pointer}
.rlist button:hover{color:var(--accent)}
.rlist button[aria-current="true"]{border-left-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.sheet{display:flex;flex-direction:column;gap:22px}
.sheet .head{display:flex;flex-direction:column;gap:8px}
.block{display:flex;flex-direction:column;gap:10px}
.conds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:c}
.cond{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 52px;position:relative;counter-increment:c}
.cond::before{content:counter(c);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--surface);font:600 13px var(--f-mono);display:grid;place-items:center}
.cond h4{margin:0 0 4px;font-size:15.5px}
.cond p{margin:4px 0 0;max-width:74ch}
.kv{font-size:13.5px}
.kv b{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-right:6px}
.kv.piege{color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:6px 10px;margin-top:8px}
.kv.piege b{color:var(--warn)}
.recite .hideable{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.recite .hideable.shown{filter:none;cursor:auto;user-select:auto}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

/* Arbre */
.tree{border:1px solid var(--accent);border-radius:var(--r);background:var(--surface);padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px}
.path li{display:flex;gap:8px}
.path .y{color:var(--ok);font-weight:700}.path .n{color:var(--ko);font-weight:700}
.q{font-size:16.5px;font-weight:600}
.verdict{border-radius:8px;padding:12px 14px;font-weight:500}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.ko{background:var(--ko-bg);color:var(--ko)}

/* Articles */
.toolbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;margin-bottom:18px}
.toolbar .f{display:flex;flex-direction:column;gap:6px;min-width:220px;flex:1}
.alist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.acard.flash{outline:2px solid var(--accent)}
.anum{font-family:var(--f-display);font-weight:600;font-size:20px}
.anum small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-weight:400;margin-left:6px;letter-spacing:.05em;text-transform:uppercase}
.atext{margin:0;font-family:var(--f-display);font-size:16px;line-height:1.5}
.aret{font-size:13.5px;color:var(--muted);margin:0}
.flashbox{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}

/* Cas pratique */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.case{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:6px;font:inherit}
.case:hover{border-color:var(--accent)}
.faits{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:16px 18px;white-space:pre-line;font-family:var(--f-display);font-size:16.5px;line-height:1.6}
.steps{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.steps li{font:500 12.5px var(--f-body);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);background:var(--surface)}
.steps li.cur{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.steps li.done{color:var(--ok);border-color:var(--ok)}
textarea{width:100%;min-height:120px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);resize:vertical}
.corrige{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.corrige p{margin:0;max-width:76ch;white-space:pre-line}
.minor{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.minor h4{margin:0 0 4px;font-size:14.5px}

/* Méthode */
.method{counter-reset:m;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;max-width:820px}
.method li{counter-increment:m;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 14px 56px;position:relative}
.method li::before{content:counter(m);position:absolute;left:16px;top:13px;font:600 22px var(--f-display);color:var(--accent)}
.method h3{font-size:17px;margin-bottom:4px}
.method p{margin:0;max-width:72ch}
.note{font-size:13.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 14px;max-width:820px;margin-top:14px}

@media (max-width:860px){
  .wrap{padding-inline:16px}
  .split{grid-template-columns:minmax(0,1fr);gap:18px}
  .side{position:static;max-height:none;overflow:visible}
  .alist,.cases{grid-template-columns:minmax(0,1fr)}
  .cond{padding-left:46px}
  .tabs button{padding:10px 8px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="home-link" href="../">← Toutes les matières</a>
    <div class="eyebrow">Droit des obligations · L2</div>
    <h1>Droit des obligations</h1>
    <p>Les régimes condition par condition, les articles du Code civil à réciter et des cas pratiques corrigés étape par étape. Rien n'est enregistré : tout repart à zéro quand vous fermez la page.</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Outils">
    <button type="button" role="tab" id="t-regimes" aria-controls="p-regimes" aria-selected="true">Régimes</button>
    <button type="button" role="tab" id="t-articles" aria-controls="p-articles" aria-selected="false">Articles</button>
    <button type="button" role="tab" id="t-cas" aria-controls="p-cas" aria-selected="false">Cas pratique</button>
    <button type="button" role="tab" id="t-methode" aria-controls="p-methode" aria-selected="false">Méthode</button>
  </nav>

  <section id="p-regimes" role="tabpanel" aria-labelledby="t-regimes"></section>
  <section id="p-articles" role="tabpanel" aria-labelledby="t-articles" hidden></section>
  <section id="p-cas" role="tabpanel" aria-labelledby="t-cas" hidden></section>
  <section id="p-methode" role="tabpanel" aria-labelledby="t-methode" hidden></section>
</div>

<script>
/* =====================================================================
   CONTENU — à remplir séance par séance.
   Tout le contenu du site est dans ces trois tableaux ; l'affichage se
   construit tout seul. Modèle de chaque entrée ci-dessous (en commentaire).
   ===================================================================== */

/* RÉGIMES : un régime = un fondement de responsabilité (ou d'action).
{
  id: "fait-personnel",                         // identifiant unique, sans espace
  chapitre: "Responsabilité extracontractuelle", // sert à regrouper dans la liste
  titre: "Responsabilité du fait personnel",
  fondement: ["1240", "1241"],                   // numéros d'articles (renvoient à l'onglet Articles)
  resume: "Une phrase qui dit à quoi sert ce régime.",
  conditions: [
    { nom: "Une faute",
      question: "Le défendeur a-t-il commis une faute ?",   // posée dans l'arbre de raisonnement
      detail: "Définition, critères, jurisprudence utile.",
      preuve: "Qui doit prouver quoi.",
      piege: "L'erreur fréquente sur une copie." }
  ],
  exonerations: [
    { nom: "Force majeure", question: "Le défendeur peut-il invoquer la force majeure ?",
      detail: "Critères.", effet: "Exonération totale." }
  ],
  copie: ["Ce qui fait la différence sur une copie."]
}
*/
const REGIMES = [];

/* ARTICLES : un article du Code civil (ou d'un autre code).
{ num: "1240", code: "C. civ.", theme: "Fait personnel",
  texte: "Texte exact de l'article.",
  retenir: "Ce qu'il faut en retenir (facultatif)." }
*/
const ARTICLES = [];

/* CAS PRATIQUES : un énoncé + son corrigé découpé selon les étapes de la méthode.
{
  id: "cas-1", titre: "Titre court", seance: "TD 2",
  regimes: ["fait-personnel"],                  // ids des régimes mobilisés
  faits: "Énoncé complet du cas.",
  question: "La question posée (ex. : Paul peut-il obtenir réparation ?).",
  corrige: {
    qualification: "Faits qualifiés juridiquement.",
    probleme: "Problème de droit.",
    majeure: "Règle applicable, avec articles et jurisprudence.",
    mineure: [ { condition: "Une faute", corrige: "Application aux faits." } ],
    conclusion: "Réponse à la question."
  }
}
*/
const CAS = [];

/* ===================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const artByNum = n => ARTICLES.find(a => a.num === String(n));
const artLabel = n => { const a = artByNum(n); return `Art. ${esc(n)}${a && a.code ? " " + esc(a.code) : " C. civ."}`; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const empty = (title, text) => `<div class="empty"><strong>${title}</strong>${text}</div>`;

/* ---------- Onglets ---------- */
const TABS = ["regimes", "articles", "cas", "methode"];
function showTab(name) {
  TABS.forEach(t => {
    $("#t-" + t).setAttribute("aria-selected", String(t === name));
    $("#p-" + t).hidden = t !== name;
  });
}
TABS.forEach(t => $("#t-" + t).addEventListener("click", () => showTab(t)));
$(".tabs").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const cur = TABS.findIndex(t => $("#t-" + t).getAttribute("aria-selected") === "true");
  const next = TABS[(cur + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length];
  showTab(next); $("#t-" + next).focus();
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-art]");
  if (b) { e.preventDefault(); goToArticle(b.dataset.art); }
});

/* ---------- Régimes ---------- */
const R = { cur: REGIMES[0]?.id || null, q: "", recite: false, tree: null };

function renderRegimes() {
  const p = $("#p-regimes");
  if (!REGIMES.length) {
    p.innerHTML = empty("Aucun régime pour l'instant", "Chaque régime aura sa fiche : fondement, conditions à vérifier une par une, causes d'exonération et arbre de raisonnement.");
    return;
  }
  p.innerHTML = `<div class="split">
    <aside class="side" aria-label="Liste des régimes">
      <input type="search" id="rq" placeholder="Rechercher un régime, une condition…" autocomplete="off" value="${esc(R.q)}">
      <label class="row" style="font-size:14px;cursor:pointer"><input type="checkbox" id="rrec" ${R.recite ? "checked" : ""}> Mode récitation</label>
      <p class="muted" style="margin:0;font-size:12.5px">Le détail des conditions est flouté : récitez-le, puis cliquez pour vérifier.</p>
      <ul class="rlist" id="rlist"></ul>
    </aside>
    <div id="sheet"></div>
  </div>`;
  $("#rq").addEventListener("input", e => { R.q = e.target.value; drawList(); });
  $("#rrec").addEventListener("change", e => { R.recite = e.target.checked; drawSheet(); });
  drawList(); drawSheet();
}
function regimeText(r) {
  return [r.titre, r.chapitre, r.resume, ...(r.conditions || []).flatMap(c => [c.nom, c.detail]), ...(r.exonerations || []).map(x => x.nom)].join(" ").toLowerCase();
}
function drawList() {
  const q = R.q.trim().toLowerCase();
  const list = REGIMES.filter(r => !q || regimeText(r).includes(q));
  let html = "", ch = null;
  list.forEach(r => {
    if (r.chapitre !== ch) { ch = r.chapitre; html += `<li class="ch">${esc(ch || "Autres")}</li>`; }
    html += `<li><button type="button" data-rid="${esc(r.id)}" aria-current="${r.id === R.cur}">${esc(r.titre)}</button></li>`;
  });
  $("#rlist").innerHTML = html || `<li class="muted" style="font-size:14px">Aucun résultat.</li>`;
  $("#rlist").querySelectorAll("[data-rid]").forEach(b => b.addEventListener("click", () => {
    R.cur = b.dataset.rid; R.tree = null; drawList(); drawSheet();
    if (window.innerWidth <= 860) $("#sheet").scrollIntoView({ behavior: "smooth", block: "start" });
  }));
}
function drawSheet() {
  const r = REGIMES.find(x => x.id === R.cur) || REGIMES[0];
  const box = $("#sheet");
  const h = cls => R.recite ? `hideable ${cls || ""}` : (cls || "");
  box.className = "sheet" + (R.recite ? " recite" : "");
  box.innerHTML = `
    <div class="head">
      <div class="eyebrow">${esc(r.chapitre || "")}</div>
      <h2>${esc(r.titre)}</h2>
      ${r.resume ? `<p style="margin:0;max-width:72ch">${esc(r.resume)}</p>` : ""}
      ${(r.fondement || []).length ? `<div class="row"><span class="lab">Fondement</span>${r.fondement.map(n => `<button type="button" class="art" data-art="${esc(n)}">${artLabel(n)}</button>`).join("")}</div>` : ""}
    </div>
    ${(r.conditions || []).length ? `<div class="block"><h3>Conditions</h3><ol class="conds">${r.conditions.map(c => `
      <li class="cond"><h4>${esc(c.nom)}</h4>
        <div class="${h()}">
          ${c.detail ? `<p>${esc(c.detail)}</p>` : ""}
          ${c.preuve ? `<p class="kv"><b>Preuve</b>${esc(c.preuve)}</p>` : ""}
          ${c.piege ? `<p class="kv piege"><b>Piège</b>${esc(c.piege)}</p>` : ""}
        </div></li>`).join("")}</ol></div>` : ""}
    ${(r.exonerations || []).length ? `<div class="block"><h3>Causes d'exonération</h3><ul class="plain">${r.exonerations.map(x => `
      <li><strong>${esc(x.nom)}</strong><span class="${h()}">${x.detail ? " — " + esc(x.detail) : ""}${x.effet ? ` <em>(${esc(x.effet)})</em>` : ""}</span></li>`).join("")}</ul></div>` : ""}
    ${(r.copie || []).length ? `<div class="block"><h3>Sur une copie</h3><ul class="plain">${r.copie.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${(r.conditions || []).length ? `<div class="block"><div class="row"><button type="button" class="btn primary" id="treeGo">${R.tree ? "Recommencer" : "Lancer"} l'arbre de raisonnement</button><span class="muted" style="font-size:13.5px">Répondez condition par condition sur les faits de votre cas.</span></div><div id="tree"></div></div>` : ""}
  `;
  box.querySelectorAll(".hideable").forEach(el => el.addEventListener("click", () => el.classList.add("shown")));
  const g = $("#treeGo");
  if (g) g.addEventListener("click", () => { R.tree = { i: 0, phase: "cond", path: [], end: null }; drawTree(r); g.textContent = "Recommencer l'arbre de raisonnement"; });
  if (R.tree) drawTree(r);
}
function drawTree(r) {
  const t = R.tree, box = $("#tree");
  const conds = r.conditions || [], exos = r.exonerations || [];
  const pathHtml = t.path.length ? `<ol class="path">${t.path.map(s => `<li><span class="${s.ok ? "y" : "n"}">${s.ok ? "Oui" : "Non"}</span><span>${esc(s.label)}</span></li>`).join("")}</ol>` : "";
  let body;
  if (t.end) {
    body = `<div class="verdict ${t.end.ok ? "ok" : "ko"}">${esc(t.end.text)}</div>`;
  } else {
    const item = t.phase === "cond" ? conds[t.i] : exos[t.i];
    const qtext = item.question || (t.phase === "cond" ? `La condition « ${item.nom} » est-elle remplie ?` : `Le défendeur peut-il invoquer : ${item.nom} ?`);
    body = `<div class="lab">${t.phase === "cond" ? `Condition ${t.i + 1} / ${conds.length}` : `Exonération ${t.i + 1} / ${exos.length}`}</div>
      <div class="q">${esc(qtext)}</div>
      <div class="row"><button type="button" class="btn ok" data-a="1">Oui</button><button type="button" class="btn ko" data-a="0">Non</button></div>`;
  }
  box.innerHTML = `<div class="tree" aria-live="polite">${pathHtml}${body}</div>`;
  box.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => answerTree(r, b.dataset.a === "1")));
}
function answerTree(r, yes) {
  const t = R.tree, conds = r.conditions || [], exos = r.exonerations || [];
  if (t.phase === "cond") {
    const c = conds[t.i];
    t.path.push({ ok: yes, label: c.nom });
    if (!yes) { t.end = { ok: false, text: `La condition « ${c.nom} » fait défaut : la responsabilité ne peut pas être engagée sur ce fondement. Envisagez un autre fondement.` }; }
    else if (++t.i >= conds.length) {
      if (exos.length) { t.phase = "exo"; t.i = 0; }
      else t.end = { ok: true, text: "Toutes les conditions sont réunies : la responsabilité est engagée sur ce fondement." };
    }
  } else {
    const x = exos[t.i];
    t.path.push({ ok: !yes, label: `${x.nom} ${yes ? "invocable" : "non invocable"}` });
    if (yes) { t.end = { ok: false, text: `Conditions réunies, mais le défendeur peut invoquer : ${x.nom}.${x.effet ? " " + x.effet : ""}` }; }
    else if (++t.i >= exos.length) t.end = { ok: true, text: "Toutes les conditions sont réunies et aucune cause d'exonération ne joue : la responsabilité est engagée sur ce fondement." };
  }
  drawTree(r);
}

/* ---------- Articles ---------- */
const A = { mode: "lire", q: "", theme: null, deck: [], i: 0, shown: false, known: 0, again: [] };

function renderArticles() {
  const p = $("#p-articles");
  if (!ARTICLES.length) {
    p.innerHTML = empty("Aucun article pour l'instant", "Chaque article aura son texte exact et ce qu'il faut en retenir, avec un mode « Réciter » pour s'entraîner de mémoire.");
    return;
  }
  const themes = [...new Set(ARTICLES.map(a => a.theme).filter(Boolean))];
  p.innerHTML = `<div class="toolbar">
      <div class="f"><label class="lab" for="aq">Rechercher</label><input type="search" id="aq" placeholder="Numéro, mot du texte…" autocomplete="off" value="${esc(A.q)}"></div>
      <div class="f" style="flex:0 1 auto;min-width:0"><span class="lab">Mode</span>
        <div class="seg" role="group" aria-label="Mode"><button type="button" data-m="lire" aria-pressed="${A.mode === "lire"}">Lire</button><button type="button" data-m="reciter" aria-pressed="${A.mode === "reciter"}">Réciter</button></div></div>
      ${themes.length > 1 ? `<div class="f" style="flex-basis:100%"><span class="lab">Thème</span><div class="chips">${[null, ...themes].map(t => `<button type="button" class="chip" data-t="${esc(t ?? "")}" aria-pressed="${A.theme === t}">${esc(t ?? "Tous")}</button>`).join("")}</div></div>` : ""}
    </div><div id="abody"></div>`;
  $("#aq").addEventListener("input", e => { A.q = e.target.value; startDeck(); drawArticles(); });
  p.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => { A.mode = b.dataset.m; renderArticles(); }));
  p.querySelectorAll("[data-t]").forEach(b => b.addEventListener("click", () => { A.theme = b.dataset.t || null; renderArticles(); }));
  startDeck(); drawArticles();
}
function filteredArticles() {
  const q = A.q.trim().toLowerCase();
  return ARTICLES.filter(a => (!A.theme || a.theme === A.theme) && (!q || [a.num, a.texte, a.retenir, a.theme].join(" ").toLowerCase().includes(q)));
}
function startDeck(list) { A.deck = shuffle(list || filteredArticles()); A.i = 0; A.shown = false; A.known = 0; A.again = []; }
function articleCard(a) {
  return `<article class="acard" id="art-${esc(a.num)}"><div class="anum">Article ${esc(a.num)}<small>${esc(a.code || "C. civ.")}${a.theme ? " · " + esc(a.theme) : ""}</small></div>
    <p class="atext">${esc(a.texte)}</p>${a.retenir ? `<p class="aret"><strong>À retenir :</strong> ${esc(a.retenir)}</p>` : ""}</article>`;
}
function drawArticles() {
  const box = $("#abody");
  if (A.mode === "lire") {
    const list = filteredArticles().slice().sort((x, y) => parseFloat(x.num) - parseFloat(y.num) || String(x.num).localeCompare(String(y.num)));
    box.innerHTML = list.length ? `<div class="alist">${list.map(articleCard).join("")}</div>` : `<p class="muted">Aucun article ne correspond.</p>`;
    return;
  }
  if (!A.deck.length) { box.innerHTML = `<p class="muted">Aucun article ne correspond.</p>`; return; }
  if (A.i >= A.deck.length) {
    box.innerHTML = `<div class="flashbox panel"><h2>${A.known} / ${A.deck.length} articles sus</h2>
      ${A.again.length ? `<p style="margin:0">À revoir : ${A.again.map(a => `<button type="button" class="art" data-art="${esc(a.num)}">${esc(a.num)}</button>`).join(" ")}</p>` : `<p style="margin:0">Aucun article à revoir.</p>`}
      <div class="row">${A.again.length ? `<button type="button" class="btn primary" id="aAgain">Réciter les articles à revoir</button>` : ""}<button type="button" class="btn" id="aRestart">Tout recommencer</button></div></div>`;
    const ag = $("#aAgain"); if (ag) ag.addEventListener("click", () => { startDeck(A.again); drawArticles(); });
    $("#aRestart").addEventListener("click", () => { startDeck(); drawArticles(); });
    return;
  }
  const a = A.deck[A.i];
  box.innerHTML = `<div class="flashbox">
    <div class="meta"><span>${A.i + 1} / ${A.deck.length}</span><span>${A.known} su${A.known > 1 ? "s" : ""}</span></div>
    <div class="bar"><i style="width:${(A.i / A.deck.length) * 100}%"></i></div>
    <article class="acard"><div class="anum">Article ${esc(a.num)}<small>${esc(a.code || "C. civ.")}${a.theme ? " · " + esc(a.theme) : ""}</small></div>
      ${A.shown ? `<p class="atext">${esc(a.texte)}</p>${a.retenir ? `<p class="aret"><strong>À retenir :</strong> ${esc(a.retenir)}</p>` : ""}` : `<p class="muted" style="margin:0">Récitez le texte de l'article, puis vérifiez.</p>`}
    </article>
    <div class="row">${A.shown
      ? `<button type="button" class="btn ok" id="aKnow">Je savais</button><button type="button" class="btn ko" id="aMiss">À revoir</button>`
      : `<button type="button" class="btn primary" id="aShow">Afficher le texte</button>`}</div></div>`;
  if (A.shown) {
    $("#aKnow").addEventListener("click", () => { A.known++; A.i++; A.shown = false; drawArticles(); });
    $("#aMiss").addEventListener("click", () => { A.again.push(a); A.i++; A.shown = false; drawArticles(); });
  } else $("#aShow").addEventListener("click", () => { A.shown = true; drawArticles(); });
}
function goToArticle(num) {
  showTab("articles");
  if (!ARTICLES.length) return;
  A.mode = "lire"; A.q = ""; A.theme = null; renderArticles();
  const el = document.getElementById("art-" + num);
  if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1600); }
}

/* ---------- Cas pratique ---------- */
const STEPS = [
  { k: "qualification", t: "Qualification des faits", h: "Traduisez les faits en termes juridiques : qui sont les parties, quel est le dommage, quel fait l'a causé ?" },
  { k: "probleme", t: "Problème de droit", h: "Formulez la question juridique, en termes généraux et abstraits." },
  { k: "majeure", t: "Majeure", h: "Énoncez la règle : articles, conditions, jurisprudence." },
  { k: "mineure", t: "Mineure", h: "Appliquez la règle aux faits, condition par condition." },
  { k: "conclusion", t: "Conclusion", h: "Répondez précisément à la question posée." }
];
const C = { cur: null, step: 0, shown: {}, drafts: {} };

function renderCas() {
  const p = $("#p-cas");
  if (!CAS.length) {
    p.innerHTML = empty("Aucun cas pratique pour l'instant", "Chaque cas aura son énoncé et un corrigé découpé en étapes : qualification, problème de droit, majeure, mineure, conclusion. Vous rédigez d'abord, puis vous comparez.");
    return;
  }
  const c = CAS.find(x => x.id === C.cur);
  if (!c) {
    p.innerHTML = `<div class="cases">${CAS.map(x => `<button type="button" class="case" data-cid="${esc(x.id)}">
      <span class="lab">${esc(x.seance || "Cas pratique")}</span><h3>${esc(x.titre)}</h3>
      ${(x.regimes || []).length ? `<span class="muted" style="font-size:13.5px">${x.regimes.map(id => esc(REGIMES.find(r => r.id === id)?.titre || id)).join(" · ")}</span>` : ""}</button>`).join("")}</div>`;
    p.querySelectorAll("[data-cid]").forEach(b => b.addEventListener("click", () => { C.cur = b.dataset.cid; C.step = 0; C.shown = {}; C.drafts = {}; renderCas(); window.scrollTo({ top: 0, behavior: "smooth" }); }));
    return;
  }
  const s = STEPS[C.step], cor = c.corrige || {};
  let corHtml;
  if (s.k === "mineure") {
    const m = cor.mineure || [];
    corHtml = m.length ? m.map(x => `<div class="minor"><h4>${esc(x.condition)}</h4><p>${esc(x.corrige)}</p></div>`).join("") : `<p class="muted">Pas de corrigé pour cette étape.</p>`;
  } else corHtml = cor[s.k] ? `<p>${esc(cor[s.k])}</p>` : `<p class="muted">Pas de corrigé pour cette étape.</p>`;
  p.innerHTML = `<div style="display:flex;flex-direction:column;gap:18px;max-width:860px">
    <div class="row"><button type="button" class="btn" id="cBack">← Tous les cas</button><span class="lab">${esc(c.seance || "")}</span></div>
    <h2>${esc(c.titre)}</h2>
    <div class="faits">${esc(c.faits)}${c.question ? `\n\n<strong>${esc(c.question)}</strong>` : ""}</div>
    <ol class="steps">${STEPS.map((x, i) => `<li class="${i === C.step ? "cur" : C.shown[x.k] ? "done" : ""}">${i + 1}. ${esc(x.t)}</li>`).join("")}</ol>
    <div class="panel" style="display:flex;flex-direction:column;gap:12px">
      <h3>${C.step + 1}. ${esc(s.t)}</h3>
      <p class="muted" style="margin:0">${esc(s.h)}</p>
      <label class="lab" for="draft">Votre réponse (non enregistrée)</label>
      <textarea id="draft">${esc(C.drafts[s.k] || "")}</textarea>
      ${C.shown[s.k] ? `<div class="corrige"><span class="lab">Corrigé</span>${corHtml}</div>` : `<div><button type="button" class="btn primary" id="cShow">Voir le corrigé</button></div>`}
      <div class="row" style="justify-content:space-between">
        <button type="button" class="btn" id="cPrev" ${C.step === 0 ? "disabled" : ""}>← Étape précédente</button>
        ${C.step < STEPS.length - 1 ? `<button type="button" class="btn" id="cNext">Étape suivante →</button>` : `<button type="button" class="btn" id="cEnd">Terminer</button>`}
      </div>
    </div></div>`;
  const draft = $("#draft");
  draft.addEventListener("input", () => { C.drafts[s.k] = draft.value; });
  $("#cBack").addEventListener("click", () => { C.cur = null; renderCas(); });
  const sh = $("#cShow"); if (sh) sh.addEventListener("click", () => { C.shown[s.k] = true; renderCas(); });
  $("#cPrev").addEventListener("click", () => { C.step--; renderCas(); });
  const nx = $("#cNext"); if (nx) nx.addEventListener("click", () => { C.step++; renderCas(); });
  const en = $("#cEnd"); if (en) en.addEventListener("click", () => { C.cur = null; renderCas(); });
}

/* ---------- Méthode ---------- */
function renderMethode() {
  $("#p-methode").innerHTML = `<ol class="method">${STEPS.map(s => `<li><h3>${esc(s.t)}</h3><p>${esc(s.h)}</p></li>`).join("")}</ol>
    <p class="note">Trame générale du syllogisme juridique. Elle sera alignée sur le fascicule de méthodologie de L2 : plan attendu, formulations et points notés.</p>`;
}

renderRegimes(); renderArticles(); renderCas(); renderMethode();
</script>
