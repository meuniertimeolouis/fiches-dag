<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Réviser · accès privé</title>
<style>
:root{--fond:#FAF8F4;--texte:#22262D;--accent:#14284B;--carte:#fff;--bord:#DCD7CD;--erreur:#A12A2A}
@media (prefers-color-scheme:dark){:root{--fond:#16181C;--texte:#E8E6E1;--accent:#9DB4E0;--carte:#20232A;--bord:#3A3E47;--erreur:#F08A8A}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--fond);color:var(--texte);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:100%;max-width:360px;background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:28px 24px}
h1{margin:0 0 4px;font-size:1.35rem;color:var(--accent)}
p{margin:0 0 20px;opacity:.8}
input[type=password]{width:100%;padding:12px;font:inherit;color:inherit;background:transparent;border:1px solid var(--bord);border-radius:8px}
input[type=password]:focus{outline:2px solid var(--accent);outline-offset:1px}
label.mem{display:flex;gap:8px;align-items:center;margin:14px 0 18px;font-size:.95rem}
button{width:100%;padding:12px;font:inherit;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:var(--fond);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:1.5em;margin:12px 0 0;color:var(--erreur);font-size:.95rem}
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Réviser</h1>
  <p>Ce site est privé. Entrez le mot de passe pour l'ouvrir.</p>
  <input id="mdp" type="password" autocomplete="current-password" placeholder="Mot de passe" aria-label="Mot de passe" required autofocus>
  <label class="mem"><input id="mem" type="checkbox" checked> Se souvenir de moi sur cet appareil</label>
  <button id="ok">Ouvrir</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
(function () {
  var D = /*DONNEES*/null;
  var CLE = "reviser.acces.v1";
  var S = crypto.subtle;
  var dec = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var enc = function (b) { var s = "", u = new Uint8Array(b); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  function lire() { try { return localStorage.getItem(CLE); } catch (e) { return null; } }
  function ecrire(v) { try { v ? localStorage.setItem(CLE, v) : localStorage.removeItem(CLE); } catch (e) {} }

  async function derive(mdp) {
    var base = await S.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveBits"]);
    return S.deriveBits({ name: "PBKDF2", salt: dec(D.salt), iterations: D.iterations, hash: "SHA-256" }, base, 256);
  }
  async function ouvrir(bits) {
    var kek = await S.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
    var pk = await S.decrypt({ name: "AES-GCM", iv: dec(D.iv) }, kek, dec(D.cle)); // échoue si mauvais mot de passe
    var priv = await S.importKey("pkcs8", pk, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["decrypt"]);
    var cle = await S.decrypt({ name: "RSA-OAEP" }, priv, dec(D.cleSite));
    var aes = await S.importKey("raw", cle, "AES-GCM", false, ["decrypt"]);
    var gz = await S.decrypt({ name: "AES-GCM", iv: dec(D.ivSite) }, aes, dec(D.site));
    var flux = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Response(flux).text();
  }
  function afficher(html) { document.open(); document.write(html); document.close(); }

  var f = document.getElementById("f"), err = document.getElementById("err"), ok = document.getElementById("ok");
  f.addEventListener("submit", async function (e) {
    e.preventDefault(); err.textContent = ""; ok.disabled = true; ok.textContent = "Ouverture…";
    try {
      var bits = await derive(document.getElementById("mdp").value);
      var html = await ouvrir(bits);
      ecrire(document.getElementById("mem").checked ? enc(bits) : null);
      afficher(html);
    } catch (x) {
      err.textContent = "Mot de passe incorrect."; ok.disabled = false; ok.textContent = "Ouvrir";
    }
  });

  var memo = lire();
  if (memo) {
    ouvrir(dec(memo).buffer).then(afficher, function () { ecrire(null); f.hidden = false; });
  } else f.hidden = false;
})();
</script>
</body>
</html>
